name: studypath
description: "UPSC & JPSC aspirant companion app — syllabus tracking, revision, analytics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.69.0

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Date/time
  intl: ^0.19.0

  # Local persistence
  shared_preferences: ^2.3.2

  # IDs
  uuid: ^4.5.0

  # Progress indicators
  percent_indicator: ^4.2.3

  # Swipeable cards
  flutter_card_swiper: ^7.0.1

  # Shimmer loading
  shimmer: ^3.0.0

  # Table calendar
  table_calendar: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.8

  # Backend & Authentication
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1

  # Native Splash
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FBF9F6"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  color: "#FBF9F6"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#FBF9F6"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
